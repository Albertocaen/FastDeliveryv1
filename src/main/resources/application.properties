# Server
server.port=${SERVER_PORT:8080}

# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:true}

# Mail
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE}
spring.mail.properties.mail.debug=${SPRING_MAIL_DEBUG:false}

# Uploads
ruta.imagenes=${RUTA_IMAGENES:/app/uploads}
uploads.path=${UPLOADS_PATH:/app/uploads}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600}

# PayPal
paypal.client.id=${PAYPAL_CLIENT_ID}
paypal.client.secret=${PAYPAL_CLIENT_SECRET}
paypal.mode=${PAYPAL_MODE:sandbox}
paypal.success.url=${PAYPAL_SUCCESS_URL}
paypal.cancel.url=${PAYPAL_CANCEL_URL}

# URLs
app.base.url=${APP_BASE_URL:https://bacodelivery.com}
api.base.url=${API_BASE_URL:https://bacodelivery.com}

# Logging
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}

# Actuator (para healthcheck)
management.endpoints.web.exposure.include=health

# DevTools
spring.devtools.restart.enabled=${SPRING_DEVTOOLS_RESTART_ENABLED:false}
