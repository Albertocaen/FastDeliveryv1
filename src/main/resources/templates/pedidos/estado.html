<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar estado — Baco</title>
</head>
<body>
<div class="form-container" th:fragment="estado">
    <h1 class="title">Cambiar estado del pedido</h1>
    <form th:action="@{/pedidos/estado}" th:object="${pedido}" method="post">
        <input type="hidden" th:field="*{id}" />

        <label for="estado">Estado</label>
        <select th:field="*{estado}" id="estado">
            <option value="En Curso">En curso</option>
            <option value="Entregado">Entregado</option>
            <option value="Cancelado">Cancelado</option>
        </select>

        <button type="submit" class="btn-submit">
            Actualizar estado
        </button>
    </form>

    <div th:if="${message}" class="form-message">
        <p th:text="${message}"></p>
    </div>
</div>
</body>
</html>
