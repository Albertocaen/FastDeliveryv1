<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error inesperado — Baco</title>
    <link rel="icon" href="/static/uploads/nuevologo.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="/static/css/error/404.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.13/lottie.min.js"></script>
</head>
<body>
<div class="container">
    <div class="lottie-container" id="lottie-error"></div>
    <h1>Algo salió mal</h1>
    <p th:text="${errorMessage}">Ha ocurrido un error inesperado. Por favor, inténtalo de nuevo en unos instantes.</p>
    <a th:href="@{/}">Volver al inicio</a>
</div>
<script>
    lottie.loadAnimation({
        container: document.getElementById('lottie-error'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: '/static/animations/generico.json'
    });
</script>
</body>
</html>
